name: Оновлення даних

# Першого числа кожного місяця о 04:00 UTC (07:00 за Києвом)
# плюс кнопка ручного запуску
on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tryvoha-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Залежності
        run: pip install telethon pandas

      # База завелика для git. Тримаємо її в кеші між запусками.
      - name: Дістати базу з кешу
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: messages.db
          key: tryvoha-db-${{ github.run_id }}
          restore-keys: tryvoha-db-

      # Перший запуск: кеш порожній — тягнемо базу з релізу
      - name: Завантажити базу з релізу
        if: steps.cache.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Кеш порожній — беру базу з релізу seed"
          gh release download seed --pattern 'messages.db*' --clobber
          if [ -f messages.db.gz ]; then gunzip -f messages.db.gz; fi
          ls -la messages.db

      - name: Перевірити базу
        run: |
          test -f messages.db || { echo "::error::messages.db відсутня"; exit 1; }
          echo "Розмір: $(du -h messages.db | cut -f1)"
          python - <<'PY'
          import sqlite3
          c = sqlite3.connect('messages.db')
          n = c.execute("SELECT COUNT(*) FROM messages").fetchone()[0]
          print(f"Повідомлень у базі: {n:,}".replace(',', ' '))
          PY

      - name: Відновити сесію Telegram
        env:
          TG_SESSION_B64: ${{ secrets.TG_SESSION_B64 }}
        run: |
          echo "$TG_SESSION_B64" | base64 -d > scraper.session
          test -s scraper.session || { echo "::error::порожня сесія"; exit 1; }

      - name: Докачати нові повідомлення
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: python update.py

      # Датасет тривог оновлюється в автора щодня — тягнемо свіжий щоразу,
      # інакше історія тривог назавжди лишиться станом на день першої збірки.
      - name: Оновити датасет тривог
        run: |
          curl -sSL --retry 3 -o official_data_uk.csv \
            "https://raw.githubusercontent.com/Vadimkin/ukrainian-air-raid-sirens-dataset/main/datasets/official_data_uk.csv"
          echo "рядків у датасеті: $(wc -l < official_data_uk.csv)"
          mkdir -p data && cp official_data_uk.csv data/official_data_uk.csv

      - name: Перебудувати дані
        run: |
          python build_alerts.py
          python parse_kpszsu.py
          python geocode_threats.py
          python extract_all.py

      - name: Перебудувати сторінки
        run: |
          python build_map.py
          python build_weapons.py
          python build_zoom_map.py
          python build_deck_map.py
          python export_data.py

      - name: Зібрати теку сайту
        run: |
          mkdir -p site
          for pair in \
            "index.html:index.html" \
            "about.html:about.html" \
            "robots.txt:robots.txt" \
            "sitemap.xml:sitemap.xml" \
            "pid-tryvohoyu.html:raiony.html" \
            "tryvoha-threats.html:drony.html" \
            "ukraine-alert-map.html:oblasti.html" \
            "zbroya.html:zbroya.html" \
            "karta.html:karta.html" \
            "live.html:live.html" \
            "mapa.html:mapa.html" \
            "events.json:events.json" \
            "settlements.json:settlements.json" \
            "raiony_alerts.geojson:raiony_alerts.geojson"
          do
            src="${pair%%:*}"; dst="${pair##*:}"
            if [ -f "$src" ]; then cp "$src" "site/$dst"; else echo "::warning::немає $src"; fi
          done
          cp -r data site/data
          du -sh site

      - name: Опублікувати на Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npx --yes netlify-cli@17.38.1 deploy \
            --dir=site --prod \
            --site "${{ secrets.NETLIFY_SITE_ID }}" \
            --message "Автооновлення $(date -u +%F)"

      - name: Закомітити відкриті дані
        run: |
          git config user.name  "tryvoha-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Дані станом на $(date -u +%F)"
          git push || echo "нічого пушити"

      - name: Зберегти базу в кеш
        if: always()
        uses: actions/cache/save@v4
        with:
          path: messages.db
          key: tryvoha-db-${{ github.run_id }}

      # Кеш Actions видаляється через 7 днів без звернень, а розклад місячний —
      # тобто до наступного запуску кеша гарантовано не буде. Тому свіжу базу
      # щоразу кладемо в реліз: саме звідти її візьме наступний прогон.
      - name: Оновити знімок бази в релізі
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gzip -kf messages.db
          ls -lh messages.db.gz
          gh release upload seed messages.db.gz --clobber
          gh release edit seed --notes "Знімок бази станом на $(date -u +%F). Оновлюється автоматично."
          echo "Знімок оновлено — наступний запуск стартує з цієї бази"

      - name: Підсумок
        if: always()
        run: |
          echo "### Оновлення даних $(date -u +%F)" >> $GITHUB_STEP_SUMMARY
          if [ -f messages.db ]; then
            python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import sqlite3
          c = sqlite3.connect('messages.db')
          n = c.execute("SELECT COUNT(*) FROM messages").fetchone()[0]
          last = c.execute("SELECT MAX(ts) FROM messages").fetchone()[0]
          try:
              e = c.execute("SELECT COUNT(*) FROM events").fetchone()[0]
          except Exception:
              e = 0
          print(f"- Повідомлень у базі: {n:,}".replace(',', ' '))
          print(f"- Останнє повідомлення: {last}")
          print(f"- Подій витягнуто: {e:,}".replace(',', ' '))
          PY
          fi
